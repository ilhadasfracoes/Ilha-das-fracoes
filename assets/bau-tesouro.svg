<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-labelledby="titulo-bau">
  <title id="titulo-bau">Baú do tesouro aberto, cheio de moedas e joias</title>
  <defs>
    <radialGradient id="brilho" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFF6B8"/>
      <stop offset="0.6" stop-color="#FFE066" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Brilho mágico -->
  <circle cx="120" cy="100" r="110" fill="url(#brilho)"/>
  <!-- Sombra -->
  <ellipse cx="120" cy="198" rx="92" ry="12" fill="#000" opacity="0.18"/>

  <!-- Tampa aberta (por trás) -->
  <path d="M42 112 L58 46 Q120 22 182 46 L198 112 Z" fill="#9A4F1F" stroke="#4A230B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M54 108 L66 56 Q120 38 174 56 L186 108 Z" fill="#3E1F0A"/>
  <path d="M86 38 L82 108 M154 38 L158 108" stroke="#FFC93C" stroke-width="10"/>

  <!-- Moedas transbordando -->
  <g stroke="#B7791F" stroke-width="3">
    <ellipse cx="80" cy="104" rx="18" ry="9" fill="#FFD23F"/>
    <ellipse cx="108" cy="96" rx="18" ry="9" fill="#FFE066"/>
    <ellipse cx="136" cy="100" rx="18" ry="9" fill="#FFD23F"/>
    <ellipse cx="162" cy="106" rx="18" ry="9" fill="#FFE066"/>
    <ellipse cx="122" cy="86" rx="16" ry="8" fill="#FFD23F"/>
    <ellipse cx="94" cy="84" rx="14" ry="7" fill="#FFE066"/>
  </g>
  <!-- Joias -->
  <path d="M146 72 l12 -12 12 12 -12 16z" fill="#4D96FF" stroke="#1D4E89" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 80 l10 -10 10 10 -10 12z" fill="#E63946" stroke="#7A1720" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="112" cy="70" r="8" fill="#6BCB77" stroke="#1F6B35" stroke-width="3"/>

  <!-- Corpo do baú -->
  <rect x="40" y="110" width="160" height="80" rx="10" fill="#B5652B" stroke="#4A230B" stroke-width="5"/>
  <path d="M44 132 H196" stroke="#8A4517" stroke-width="3"/>
  <path d="M44 158 H196" stroke="#8A4517" stroke-width="3"/>
  <rect x="62" y="110" width="16" height="80" fill="#FFC93C" stroke="#4A230B" stroke-width="3"/>
  <rect x="162" y="110" width="16" height="80" fill="#FFC93C" stroke="#4A230B" stroke-width="3"/>
  <rect x="40" y="108" width="160" height="12" rx="4" fill="#FFC93C" stroke="#4A230B" stroke-width="3"/>
  <!-- Fechadura -->
  <rect x="106" y="126" width="28" height="32" rx="6" fill="#FFD23F" stroke="#4A230B" stroke-width="3.5"/>
  <circle cx="120" cy="138" r="4.5" fill="#4A230B"/>
  <path d="M120 140 v9" stroke="#4A230B" stroke-width="4" stroke-linecap="round"/>

  <!-- Brilhos -->
  <g fill="#fff">
    <path d="M40 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M200 30 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M206 140 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M22 150 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>
</svg>

