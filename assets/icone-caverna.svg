<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="titulo-caverna">
  <title id="titulo-caverna">Caverna dos Enigmas</title>
  <defs>
    <clipPath id="circulo-caverna"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>
  <g clip-path="url(#circulo-caverna)">
    <rect width="120" height="120" fill="#4B3F7A"/>
    <g fill="#fff" opacity="0.8">
      <circle cx="20" cy="22" r="1.8"/><circle cx="96" cy="18" r="1.5"/><circle cx="70" cy="12" r="1.2"/>
    </g>
    <!-- Rocha -->
    <path d="M-4 112 L14 54 L36 30 L62 20 L90 34 L110 60 L124 112 Z" fill="#8D99AE" stroke="#23314A" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M36 30 L46 50 M90 34 L82 54" stroke="#5C677D" stroke-width="3" stroke-linecap="round"/>
    <!-- Entrada da caverna -->
    <path d="M30 112 Q30 58 60 56 Q90 58 90 112 Z" fill="#1B1534" stroke="#23314A" stroke-width="3.5"/>
    <!-- Ponto de interrogação brilhante -->
    <text x="60" y="98" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="34" font-weight="bold" fill="#FFD23F">?</text>
    <!-- Cristais -->
    <path d="M18 112 L24 88 L30 112 Z" fill="#B388EB" stroke="#23314A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M26 112 L34 94 L40 112 Z" fill="#7FDBFF" stroke="#23314A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M86 112 L94 90 L100 112 Z" fill="#7FDBFF" stroke="#23314A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M96 112 L102 96 L108 112 Z" fill="#B388EB" stroke="#23314A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#23314A" stroke-width="4"/>
</svg>

